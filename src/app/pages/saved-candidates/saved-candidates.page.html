<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button menuId="main-menu"></ion-menu-button>
    </ion-buttons>
    <img
      src="../../../assets/icons/kaam-chor-logo-removebg.png"
      style="opacity: 0.7"
      alt="logo"
    />
    <!-- <ion-title>Page Title</ion-title> -->
  </ion-toolbar>
</ion-header>
<ion-content>
  <!-- <app-sidebar></app-sidebar> -->
  <ion-title class="ion-text-center" style="padding-top: 20px"
    >Saved Candidate List</ion-title
  >

  <ion-card>
    <ion-card-content class="cardBody">
      <!-- Filters -->
      <ion-row
        class="ion-align-items-center ion-justify-content-between table-controls"
      >
        <ion-col size="6">
          Show
          <!-- <ion-select [(ngModel)]="itemsPerPage" interface="popover">
            <ion-select-option *ngFor="let num of [5,10,25,50]" [value]="num">{{ num }}</ion-select-option>
          </ion-select> -->
          <select [(ngModel)]="itemsPerPage">
            <option *ngFor="let num of [5,10,25,50]" [value]="num">
              {{ num }}
            </option>
          </select>
          entries
        </ion-col>

        <ion-col size="6" class="ion-text-right">
          <ion-searchbar
            [(ngModel)]="searchTerm"
            placeholder="Search..."
            clearInput
          ></ion-searchbar>
        </ion-col>
      </ion-row>

      <!-- Data List -->
      <ion-list>
        <ion-item
          *ngFor="let user of paginatedData(); let i = index"
          lines="full"
        >
          <ion-grid>
            <ion-row>
              <ion-col size="12" class="ion-text-left">
                <ion-label color="medium"
                  >{{ (currentPage - 1) * itemsPerPage + i + 1 }}</ion-label
                >
              </ion-col>
            </ion-row>

            <ion-row class="info-row">
              <ion-col size="12">
                <strong>Name:</strong> {{ user.candidate_name }}
              </ion-col>
              <ion-col size="12">
                <strong>Mobile:</strong> {{ user.mobile_number }}
              </ion-col>
              <ion-col size="12">
                <strong>Email:</strong> {{ user.email_id }}
              </ion-col>
              <ion-col size="12">
                <strong>Saved on:</strong> {{ user.created_on }}
              </ion-col>
            </ion-row>

            <ion-row class="ion-justify-content-end">
              <ion-button
                fill="clear"
                size="small"
                (click)="presentActionSheet(user)"
              >
                <ion-icon name="ellipsis-vertical-outline"></ion-icon>
              </ion-button>
            </ion-row>
          </ion-grid>
        </ion-item>
      </ion-list>

      <!-- Pagination -->
      <div class="pagination ion-text-center">
        <ion-button
          size="small"
          fill="outline"
          (click)="prevPage()"
          [disabled]="currentPage === 1"
          >Previous</ion-button
        >
        <ion-button size="small" fill="outline">{{ currentPage }}</ion-button>
        <ion-button
          size="small"
          fill="outline"
          (click)="nextPage()"
          [disabled]="currentPage >= totalPages()"
          >Next</ion-button
        >
      </div>
    </ion-card-content>
  </ion-card>
</ion-content>
